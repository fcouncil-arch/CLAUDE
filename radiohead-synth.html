<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Everything In Its Right Place - Chord Synth</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #c8c8c8;
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
  }

  #glitch-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.15;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 30px 20px;
  }

  header {
    text-align: center;
    margin-bottom: 30px;
  }

  header h1 {
    font-size: 1.4em;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #e8e8e8;
    text-shadow: 0 0 20px rgba(200, 50, 50, 0.3);
  }

  header p {
    font-size: 0.7em;
    color: #666;
    margin-top: 8px;
    letter-spacing: 3px;
  }

  .controls-row {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .control-group {
    background: #111;
    border: 1px solid #222;
    border-radius: 4px;
    padding: 15px 20px;
    min-width: 180px;
    flex: 1;
    max-width: 260px;
  }

  .control-group label {
    display: block;
    font-size: 0.6em;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 10px;
  }

  .control-group input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    background: #1a1a1a;
    height: 4px;
    border-radius: 2px;
    outline: none;
  }

  .control-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: #c83232;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(200, 50, 50, 0.4);
  }

  .control-group select {
    width: 100%;
    background: #1a1a1a;
    color: #c8c8c8;
    border: 1px solid #333;
    padding: 6px 10px;
    font-family: 'Space Mono', monospace;
    font-size: 0.75em;
    border-radius: 3px;
    cursor: pointer;
  }

  .keyboard-section {
    background: #0e0e0e;
    border: 1px solid #1a1a1a;
    border-radius: 6px;
    padding: 25px;
    margin-bottom: 20px;
  }

  .keyboard {
    display: flex;
    justify-content: center;
    position: relative;
    height: 180px;
    max-width: 800px;
    margin: 0 auto;
  }

  .white-key {
    width: 50px;
    height: 170px;
    background: linear-gradient(to bottom, #e8e8e8, #d0d0d0);
    border: 1px solid #999;
    border-radius: 0 0 5px 5px;
    cursor: pointer;
    position: relative;
    z-index: 1;
    transition: background 0.05s, box-shadow 0.05s;
  }

  .white-key:hover {
    background: linear-gradient(to bottom, #f0f0f0, #ddd);
  }

  .white-key.active {
    background: linear-gradient(to bottom, #c83232, #a02828);
    box-shadow: 0 0 15px rgba(200, 50, 50, 0.5);
  }

  .white-key .key-label {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.55em;
    color: #888;
    pointer-events: none;
  }

  .white-key.active .key-label { color: #fff; }

  .black-key {
    width: 32px;
    height: 110px;
    background: linear-gradient(to bottom, #222, #111);
    border: 1px solid #000;
    border-radius: 0 0 4px 4px;
    position: absolute;
    z-index: 2;
    cursor: pointer;
    transition: background 0.05s, box-shadow 0.05s;
  }

  .black-key:hover {
    background: linear-gradient(to bottom, #333, #1a1a1a);
  }

  .black-key.active {
    background: linear-gradient(to bottom, #c83232, #801e1e);
    box-shadow: 0 0 15px rgba(200, 50, 50, 0.6);
  }

  .black-key .key-label {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.5em;
    color: #555;
    pointer-events: none;
  }

  .black-key.active .key-label { color: #fcc; }

  .chord-mode-section {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 20px;
  }

  .chord-btn {
    background: #111;
    border: 1px solid #2a2a2a;
    color: #888;
    padding: 8px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 0.7em;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
  }

  .chord-btn:hover {
    border-color: #c83232;
    color: #c8c8c8;
  }

  .chord-btn.active {
    background: #c83232;
    border-color: #c83232;
    color: #fff;
    box-shadow: 0 0 12px rgba(200, 50, 50, 0.3);
  }

  .info-bar {
    text-align: center;
    font-size: 0.6em;
    color: #444;
    letter-spacing: 2px;
    padding: 15px;
  }

  .info-bar span { color: #c83232; }

  .visualizer {
    width: 100%;
    height: 80px;
    margin-bottom: 20px;
    border-radius: 4px;
    overflow: hidden;
  }

  #viz-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .now-playing {
    text-align: center;
    font-size: 0.9em;
    letter-spacing: 4px;
    color: #555;
    min-height: 1.4em;
    margin-bottom: 15px;
    transition: color 0.2s;
  }

  .now-playing.on { color: #c83232; }
</style>
</head>
<body>

<canvas id="glitch-canvas"></canvas>

<div class="container">
  <header>
    <h1>Everything In Its Right Place</h1>
    <p>a radiohead chord synthesizer</p>
  </header>

  <div class="visualizer">
    <canvas id="viz-canvas"></canvas>
  </div>

  <div class="now-playing" id="now-playing"></div>

  <div class="chord-mode-section">
    <button class="chord-btn active" data-mode="sus2">SUS2</button>
    <button class="chord-btn" data-mode="sus4">SUS4</button>
    <button class="chord-btn" data-mode="add9">ADD9</button>
    <button class="chord-btn" data-mode="min7">MIN7</button>
    <button class="chord-btn" data-mode="maj7">MAJ7</button>
    <button class="chord-btn" data-mode="min9">MIN9</button>
    <button class="chord-btn" data-mode="dim">DIM</button>
    <button class="chord-btn" data-mode="power">POWER</button>
  </div>

  <div class="controls-row">
    <div class="control-group">
      <label>Detune (cents)</label>
      <input type="range" id="detune" min="0" max="40" value="12" step="1">
    </div>
    <div class="control-group">
      <label>Reverb</label>
      <input type="range" id="reverb" min="0" max="100" value="65" step="1">
    </div>
    <div class="control-group">
      <label>Delay Time</label>
      <input type="range" id="delay-time" min="0" max="1000" value="380" step="10">
    </div>
    <div class="control-group">
      <label>Delay Feedback</label>
      <input type="range" id="delay-feedback" min="0" max="90" value="45" step="1">
    </div>
  </div>

  <div class="controls-row">
    <div class="control-group">
      <label>Tremolo Rate</label>
      <input type="range" id="tremolo-rate" min="0" max="12" value="4" step="0.5">
    </div>
    <div class="control-group">
      <label>Tremolo Depth</label>
      <input type="range" id="tremolo-depth" min="0" max="100" value="30" step="1">
    </div>
    <div class="control-group">
      <label>Filter Cutoff</label>
      <input type="range" id="filter-cutoff" min="200" max="8000" value="2200" step="50">
    </div>
    <div class="control-group">
      <label>Texture</label>
      <select id="texture">
        <option value="rhodes">Rhodes (Kid A)</option>
        <option value="pad">Pad (Amnesiac)</option>
        <option value="guitar">Guitar (The Bends)</option>
        <option value="ondes">Ondes Martenot (HTTT)</option>
      </select>
    </div>
  </div>

  <div class="keyboard-section">
    <div class="keyboard" id="keyboard"></div>
  </div>

  <div class="info-bar">
    play with keyboard <span>A-L</span> / top row <span>W-U</span> for sharps &mdash; hold multiple keys for layered chords
  </div>
</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx, masterGain, reverbNode, reverbGain, dryGain, delayNode, feedbackGain, filterNode, tremoloOsc, tremoloGain, analyser;
let started = false;

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

// Chord intervals in semitones from root
const CHORD_INTERVALS = {
  sus2:  [0, 2, 7, 12, 14],
  sus4:  [0, 5, 7, 12, 17],
  add9:  [0, 4, 7, 14, 12],
  min7:  [0, 3, 7, 10, 12],
  maj7:  [0, 4, 7, 11, 16],
  min9:  [0, 3, 7, 10, 14],
  dim:   [0, 3, 6, 9, 12],
  power: [0, 7, 12, 19, 24],
};

let chordMode = 'sus2';
let activeVoices = {};

// Map keyboard keys to MIDI notes (C3 = 48 up through two octaves)
const KEY_MAP = {
  'a': 48, 'w': 49, 's': 50, 'e': 51, 'd': 52,
  'f': 53, 't': 54, 'g': 55, 'y': 56, 'h': 57,
  'u': 58, 'j': 59, 'k': 60, 'o': 61, 'l': 62,
};

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function midiToName(midi) {
  return NOTE_NAMES[midi % 12] + Math.floor(midi / 12 - 1);
}

// Build impulse response for convolution reverb
function buildImpulse(duration, decay) {
  const len = ctx.sampleRate * duration;
  const impulse = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const data = impulse.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
  }
  return impulse;
}

function initAudio() {
  if (started) return;
  started = true;

  ctx = new AudioCtx();
  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;

  masterGain = ctx.createGain();
  masterGain.gain.value = 0.35;

  // Filter - low pass for warmth
  filterNode = ctx.createBiquadFilter();
  filterNode.type = 'lowpass';
  filterNode.frequency.value = 2200;
  filterNode.Q.value = 1.5;

  // Reverb
  reverbNode = ctx.createConvolver();
  reverbNode.buffer = buildImpulse(3.5, 2.5);
  reverbGain = ctx.createGain();
  reverbGain.gain.value = 0.65;
  dryGain = ctx.createGain();
  dryGain.gain.value = 0.7;

  // Delay
  delayNode = ctx.createDelay(2.0);
  delayNode.delayTime.value = 0.38;
  feedbackGain = ctx.createGain();
  feedbackGain.gain.value = 0.45;

  // Tremolo LFO
  tremoloOsc = ctx.createOscillator();
  tremoloOsc.type = 'sine';
  tremoloOsc.frequency.value = 4;
  tremoloGain = ctx.createGain();
  tremoloGain.gain.value = 0.3;

  const tremoloAmp = ctx.createGain();
  tremoloAmp.gain.value = 1.0;

  tremoloOsc.connect(tremoloGain);
  tremoloGain.connect(tremoloAmp.gain);
  tremoloOsc.start();

  // Routing:
  // voices -> filter -> tremoloAmp -> [dry + reverb + delay] -> master -> analyser -> out
  filterNode.connect(tremoloAmp);

  tremoloAmp.connect(dryGain);
  tremoloAmp.connect(reverbNode);
  tremoloAmp.connect(delayNode);

  reverbNode.connect(reverbGain);
  reverbGain.connect(masterGain);
  dryGain.connect(masterGain);

  delayNode.connect(feedbackGain);
  feedbackGain.connect(delayNode);
  delayNode.connect(masterGain);

  masterGain.connect(analyser);
  analyser.connect(ctx.destination);

  drawViz();
}

function getTextureParams() {
  const tex = document.getElementById('texture').value;
  switch (tex) {
    case 'rhodes':
      return { types: ['sine', 'triangle'], gains: [0.6, 0.3], attack: 0.01, release: 1.2 };
    case 'pad':
      return { types: ['sawtooth', 'triangle'], gains: [0.2, 0.4], attack: 0.8, release: 2.5 };
    case 'guitar':
      return { types: ['sawtooth', 'square'], gains: [0.3, 0.15], attack: 0.005, release: 1.8 };
    case 'ondes':
      return { types: ['sine', 'sine'], gains: [0.5, 0.35], attack: 0.15, release: 2.0 };
    default:
      return { types: ['sine', 'triangle'], gains: [0.5, 0.3], attack: 0.01, release: 1.2 };
  }
}

function playChord(rootMidi) {
  if (activeVoices[rootMidi]) return;
  initAudio();

  const intervals = CHORD_INTERVALS[chordMode];
  const detuneVal = parseFloat(document.getElementById('detune').value);
  const params = getTextureParams();
  const now = ctx.currentTime;
  const nodes = [];

  intervals.forEach((interval, i) => {
    const freq = midiToFreq(rootMidi + interval);

    // Two oscillators per note, slightly detuned against each other
    for (let d = 0; d < 2; d++) {
      const osc = ctx.createOscillator();
      osc.type = params.types[d % params.types.length];
      osc.frequency.value = freq;
      osc.detune.value = (d === 0 ? -detuneVal : detuneVal) + (Math.random() * 4 - 2);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(
        params.gains[d % params.gains.length] * (i === 0 ? 1 : 0.7) * 0.25,
        now + params.attack
      );

      osc.connect(gain);
      gain.connect(filterNode);
      osc.start(now);
      nodes.push({ osc, gain });
    }
  });

  activeVoices[rootMidi] = { nodes, params };
  updateDisplay(rootMidi, true);
}

function stopChord(rootMidi) {
  const voice = activeVoices[rootMidi];
  if (!voice) return;

  const now = ctx.currentTime;
  const rel = voice.params.release;

  voice.nodes.forEach(({ osc, gain }) => {
    gain.gain.cancelScheduledValues(now);
    gain.gain.setValueAtTime(gain.gain.value, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + rel);
    osc.stop(now + rel + 0.1);
  });

  delete activeVoices[rootMidi];
  updateDisplay(rootMidi, false);
}

function updateDisplay(midi, isOn) {
  // Update keyboard visual
  const key = document.querySelector(`[data-midi="${midi}"]`);
  if (key) key.classList.toggle('active', isOn);

  // Update now-playing text
  const np = document.getElementById('now-playing');
  const playing = Object.keys(activeVoices).map(m => {
    const name = midiToName(parseInt(m));
    return name + ' ' + chordMode.toUpperCase();
  });
  np.textContent = playing.join('  /  ');
  np.classList.toggle('on', playing.length > 0);
}

// Build keyboard UI
function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';

  const whiteKeys = [48, 50, 52, 53, 55, 57, 59, 60, 62];
  const blackKeys = {49: 0, 51: 1, 54: 3, 56: 4, 58: 5, 61: 7, };

  // Key label map
  const labelMap = {
    48:'A', 49:'W', 50:'S', 51:'E', 52:'D', 53:'F', 54:'T',
    55:'G', 56:'Y', 57:'H', 58:'U', 59:'J', 60:'K', 61:'O', 62:'L'
  };

  whiteKeys.forEach((midi, i) => {
    const key = document.createElement('div');
    key.className = 'white-key';
    key.dataset.midi = midi;
    const lbl = document.createElement('span');
    lbl.className = 'key-label';
    lbl.textContent = (labelMap[midi] || '') + '\n' + midiToName(midi);
    key.appendChild(lbl);
    key.addEventListener('mousedown', (e) => { e.preventDefault(); playChord(midi); });
    key.addEventListener('mouseup', () => stopChord(midi));
    key.addEventListener('mouseleave', () => stopChord(midi));
    key.addEventListener('touchstart', (e) => { e.preventDefault(); playChord(midi); });
    key.addEventListener('touchend', () => stopChord(midi));
    kb.appendChild(key);
  });

  // Position black keys
  const whiteWidth = 50;
  Object.entries(blackKeys).forEach(([midi, afterWhiteIndex]) => {
    const m = parseInt(midi);
    const key = document.createElement('div');
    key.className = 'black-key';
    key.dataset.midi = m;
    key.style.left = ((afterWhiteIndex + 1) * whiteWidth - 16) + 'px';
    const lbl = document.createElement('span');
    lbl.className = 'key-label';
    lbl.textContent = labelMap[m] || '';
    key.appendChild(lbl);
    key.addEventListener('mousedown', (e) => { e.preventDefault(); playChord(m); });
    key.addEventListener('mouseup', () => stopChord(m));
    key.addEventListener('mouseleave', () => stopChord(m));
    key.addEventListener('touchstart', (e) => { e.preventDefault(); playChord(m); });
    key.addEventListener('touchend', () => stopChord(m));
    kb.appendChild(key);
  });
}

// Keyboard input
const heldKeys = new Set();

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const midi = KEY_MAP[e.key.toLowerCase()];
  if (midi !== undefined && !heldKeys.has(e.key.toLowerCase())) {
    heldKeys.add(e.key.toLowerCase());
    playChord(midi);
  }
});

document.addEventListener('keyup', (e) => {
  const midi = KEY_MAP[e.key.toLowerCase()];
  if (midi !== undefined) {
    heldKeys.delete(e.key.toLowerCase());
    stopChord(midi);
  }
});

// Chord mode buttons
document.querySelectorAll('.chord-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.chord-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    chordMode = btn.dataset.mode;
  });
});

// Control bindings
document.getElementById('detune').addEventListener('input', () => {});
document.getElementById('reverb').addEventListener('input', (e) => {
  if (reverbGain) reverbGain.gain.value = e.target.value / 100;
});
document.getElementById('delay-time').addEventListener('input', (e) => {
  if (delayNode) delayNode.delayTime.value = e.target.value / 1000;
});
document.getElementById('delay-feedback').addEventListener('input', (e) => {
  if (feedbackGain) feedbackGain.gain.value = e.target.value / 100;
});
document.getElementById('tremolo-rate').addEventListener('input', (e) => {
  if (tremoloOsc) tremoloOsc.frequency.value = parseFloat(e.target.value);
});
document.getElementById('tremolo-depth').addEventListener('input', (e) => {
  if (tremoloGain) tremoloGain.gain.value = e.target.value / 100;
});
document.getElementById('filter-cutoff').addEventListener('input', (e) => {
  if (filterNode) filterNode.frequency.value = parseFloat(e.target.value);
});

// Waveform visualizer
function drawViz() {
  const canvas = document.getElementById('viz-canvas');
  const vizCtx = canvas.getContext('2d');
  canvas.width = canvas.clientWidth * 2;
  canvas.height = canvas.clientHeight * 2;

  const bufLen = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufLen);

  function draw() {
    requestAnimationFrame(draw);
    analyser.getByteTimeDomainData(dataArray);

    vizCtx.fillStyle = 'rgba(10, 10, 10, 0.3)';
    vizCtx.fillRect(0, 0, canvas.width, canvas.height);

    vizCtx.lineWidth = 2;
    vizCtx.strokeStyle = '#c83232';
    vizCtx.shadowBlur = 6;
    vizCtx.shadowColor = '#c83232';
    vizCtx.beginPath();

    const sliceWidth = canvas.width / bufLen;
    let x = 0;

    for (let i = 0; i < bufLen; i++) {
      const v = dataArray[i] / 128.0;
      const y = v * canvas.height / 2;
      if (i === 0) vizCtx.moveTo(x, y);
      else vizCtx.lineTo(x, y);
      x += sliceWidth;
    }

    vizCtx.lineTo(canvas.width, canvas.height / 2);
    vizCtx.stroke();
    vizCtx.shadowBlur = 0;
  }

  draw();
}

// Glitch background
function initGlitch() {
  const canvas = document.getElementById('glitch-canvas');
  const gCtx = canvas.getContext('2d');
  canvas.width = 200;
  canvas.height = 200;

  function glitch() {
    gCtx.fillStyle = '#0a0a0a';
    gCtx.fillRect(0, 0, 200, 200);

    for (let i = 0; i < 3; i++) {
      const y = Math.random() * 200;
      const h = Math.random() * 4 + 1;
      gCtx.fillStyle = `rgba(200, 50, 50, ${Math.random() * 0.15})`;
      gCtx.fillRect(0, y, 200, h);
    }

    if (Math.random() > 0.95) {
      const sx = Math.random() * 200;
      const sy = Math.random() * 200;
      const sw = Math.random() * 80 + 20;
      const sh = Math.random() * 20 + 5;
      const imgData = gCtx.getImageData(sx, sy, Math.min(sw, 200 - sx), Math.min(sh, 200 - sy));
      gCtx.putImageData(imgData, sx + (Math.random() * 20 - 10), sy);
    }

    setTimeout(glitch, 100 + Math.random() * 200);
  }

  glitch();
}

buildKeyboard();
initGlitch();
</script>
</body>
</html>
